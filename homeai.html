<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WormGPT JailBreak</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #000000;
            border-bottom: 1px solid #1a1a1a;
            position: relative;
            z-index: 100;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            font-weight: 500;
            color: #ffffff;
        }

        .menu-btn, .user-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .menu-btn:hover, .user-btn:hover {
            background: #1a1a1a;
        }

        .menu-btn svg, .user-btn svg {
            width: 24px;
            height: 24px;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: -100%;
            top: 0;
            width: 280px;
            height: 100vh;
            background: #000000;
            transition: left 0.3s ease;
            z-index: 999;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #1a1a1a;
        }

        .sidebar.show {
            left: 0;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }

        .close-sidebar {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: background 0.2s;
        }

        .close-sidebar:hover {
            background: #1a1a1a;
        }

        .new-chat-btn {
            margin: 16px;
            padding: 12px 16px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: #2a2a2a;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .chat-list::-webkit-scrollbar {
            width: 6px;
        }

        .chat-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-list::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 3px;
        }

        .chat-item {
            padding: 12px;
            margin-bottom: 4px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
            color: #888888;
            font-size: 14px;
        }

        .chat-item:hover {
            background: #1a1a1a;
        }

        .chat-item.active {
            background: #1a1a1a;
            color: #ffffff;
        }

        .chat-item-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .delete-chat {
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            color: #666666;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .chat-item:hover .delete-chat {
            display: flex;
        }

        .delete-chat:hover {
            background: #2a2a2a;
            color: #ff4444;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            z-index: 998;
        }

        .overlay.show {
            display: block;
        }

        /* User Info */
        .user-info {
            position: fixed;
            top: 60px;
            right: 16px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            padding: 16px;
            border-radius: 12px;
            font-size: 13px;
            display: none;
            flex-direction: column;
            gap: 12px;
            z-index: 1000;
            min-width: 200px;
        }

        .user-info.show {
            display: flex;
        }

        .user-role {
            font-weight: 600;
            color: #ffffff;
            font-size: 14px;
        }

        .user-role.owner {
            color: #ffd700;
        }

        .user-limit {
            color: #888888;
            font-size: 12px;
            padding: 8px 12px;
            background: #0a0a0a;
            border-radius: 6px;
        }

        .logout-btn {
            padding: 8px 12px;
            background: #ff4444;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background: #cc0000;
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 3px;
        }

        /* Welcome Screen */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 20px;
        }

        .welcome-logo {
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .welcome-logo svg {
            width: 100%;
            height: 100%;
        }

        .welcome-title {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            text-align: center;
        }

        .welcome-subtitle {
            font-size: 15px;
            color: #888888;
            text-align: center;
            max-width: 400px;
        }

        /* Messages */
        .message {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 14px;
        }

        .message.user .message-content {
            background: #2563eb;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: #1a1a1a;
            color: #ffffff;
            border-bottom-left-radius: 4px;
        }

        /* Code Block */
        .code-block-wrapper {
            position: relative;
            margin: 12px 0;
            border-radius: 8px;
            overflow: hidden;
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0a0a0a;
            padding: 10px 14px;
            border-bottom: 1px solid #2a2a2a;
        }

        .code-language {
            font-size: 12px;
            color: #888888;
            text-transform: uppercase;
            font-weight: 600;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid #2a2a2a;
            color: #888888;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            font-weight: 500;
        }

        .copy-btn:hover {
            background: #1a1a1a;
            border-color: #3a3a3a;
        }

        .copy-btn.copied {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }

        pre {
            background: #0a0a0a;
            padding: 16px;
            overflow-x: auto;
            margin: 0;
        }

        pre::-webkit-scrollbar {
            height: 6px;
        }

        pre::-webkit-scrollbar-track {
            background: transparent;
        }

        pre::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 3px;
        }

        code {
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #e5e5e5;
        }

        /* Input Container */
        .input-container {
            padding: 16px;
            background: #000000;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            border-top: 1px solid #1a1a1a;
        }

        .input-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .action-btn:hover {
            background: #2a2a2a;
        }

        .action-btn svg {
            width: 20px;
            height: 20px;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 0 16px;
            min-height: 44px;
            max-height: 200px;
            overflow-y: auto;
        }

        .input-wrapper::-webkit-scrollbar {
            width: 6px;
        }

        .input-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }

        .input-wrapper::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 3px;
        }

        .input-wrapper:focus-within {
            border-color: #3a3a3a;
        }

        .input-field {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 14px;
            padding: 12px 0;
            outline: none;
            resize: none;
            font-family: inherit;
            line-height: 1.5;
        }

        .input-field::placeholder {
            color: #666666;
        }

        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: #2563eb;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            background: #1d4ed8;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
        }

        .scroll-btn {
            background: #2563eb;
        }

        .scroll-btn:hover {
            background: #1d4ed8;
        }

        /* Loading */
        .loading {
            display: flex;
            gap: 6px;
            padding: 8px;
        }

        .loading span {
            width: 8px;
            height: 8px;
            background: #666666;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .hidden {
            display: none !important;
        }

        /* Error Message */
        .error-message {
            background: #ff4444;
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 12px 16px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-title {
                font-size: 15px;
            }

            .sidebar {
                width: 280px;
            }

            .message-content {
                max-width: 85%;
                font-size: 14px;
            }

            .welcome-title {
                font-size: 20px;
            }

            .welcome-subtitle {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="overlay" id="overlay"></div>
    
    <!-- Sidebar -->

    <!-- Chat Container -->
    <div class="chat-container" id="chatContainer">

                <svg viewBox="0 0 200 200" fill="none">

                    <path d="M139 95C139 101.627 133.627 107 127 107C120.373 107 115 101.627 115 95C115 88.3726 120.373 83 127 83C133.627 83 139 88.3726 139 95Z" fill="white"/>

        </div>
    </div>

    <!-- Input Container -->
    <div class="input-container">
        <div class="input-actions">
            <button class="action-btn" title="Pikir Mendalam">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M12 1v6m0 6v6m8.66-15.66l-4.24 4.24m-4.24 4.24l-4.24 4.24m15.66 0l-4.24-4.24m-4.24-4.24L3.34 3.34"></path>

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

    <script src="deepseek.js"></script>
    <script type="module">
        // Import Firebase
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getDatabase, ref, get, set } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyD4H5WqXsv7TYLqYlaZUtJJcwyZaIueSls",
            authDomain: "wormgptx.firebaseapp.com",
            databaseURL: "https://wormgptx-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "wormgptx",
            storageBucket: "wormgptx.firebasestorage.app",
            messagingSenderId: "699515675996",
            appId: "1:699515675996:web:7c7367ee05318c416c4d99",
            measurementId: "G-1LWR54H8X2"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Session Management
        const session = JSON.parse(localStorage.getItem('userSession'));
        if (!session) {
            window.location.href = 'index.html';
        }

        const chatContainer = document.getElementById('chatContainer');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const scrollBtn = document.getElementById('scrollBtn');
        const userRole = document.getElementById('userRole');
        const userLimit = document.getElementById('userLimit');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const chatList = document.getElementById('chatList');
        const userInfo = document.getElementById('userInfo');

        let currentChatId = null;
        let chats = JSON.parse(localStorage.getItem('chats')) || {};
        let userCredits = 0;

        // Load credits dari Firebase
        async function loadCredits() {
            try {
                const userRef = ref(database, `UsersGPT/${session.userId}`);
                const snapshot = await get(userRef);
                
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    userCredits = userData.credits || 0;
                    updateUserInfo();
                }
            } catch (error) {
                console.error('Error loading credits:', error);
            }
        }

        // Update credits di Firebase
        async function updateCredits(newCredits) {
            try {
                await set(ref(database, `UsersGPT/${session.userId}/credits`), newCredits);
                userCredits = newCredits;
                updateUserInfo();
            } catch (error) {
                console.error('Error updating credits:', error);
            }
        }

        function isOwner() {
            return session.role === 'owner';
        }

        function canMakeRequest() {
            if (isOwner()) {
                return { allowed: true, role: 'owner' };
            }

            if (userCredits <= 0) {
                return {
                    allowed: false,
                    role: 'user',
                    message: 'Credits habis! Hubungi admin untuk top up.'
                };
            }

            return { allowed: true, role: 'user', remaining: userCredits };
        }

        async function decrementCredits() {
            if (isOwner()) return;
            const newCredits = Math.max(0, userCredits - 1);
            await updateCredits(newCredits);
        }

        function updateUserInfo() {
            if (isOwner()) {
                userRole.textContent = `${session.username} (Owner)`;
                userRole.className = 'user-role owner';
                userLimit.textContent = 'Akses Unlimited';
            } else {
                userRole.textContent = `${session.username} (User)`;
                userRole.className = 'user-role';
                userLimit.textContent = `${userCredits} credits tersisa`;
            }
        }

        window.toggleUserInfo = function() {
            userInfo.classList.toggle('show');
        }

        window.toggleSidebar = function() {
            sidebar.classList.toggle('show');
            overlay.classList.toggle('show');
        }

        overlay.addEventListener('click', () => {
            sidebar.classList.remove('show');
            overlay.classList.remove('show');
        });

        window.createNewChat = function() {
            const chatId = Date.now().toString();
            currentChatId = chatId;
            chats[chatId] = {
                title: 'Obrolan Baru',
                messages: [],
                timestamp: Date.now()
            };
            localStorage.setItem('chats', JSON.stringify(chats));
            renderChatList();
            loadChat(chatId);
            toggleSidebar();
        }

        function loadChat(chatId) {
            currentChatId = chatId;
            chatContainer.innerHTML = '';
            welcomeScreen.classList.remove('hidden');
            
            const chat = chats[chatId];
            if (chat && chat.messages.length > 0) {
                welcomeScreen.classList.add('hidden');
                chat.messages.forEach(msg => {
                    addMessage(msg.text, msg.sender, false);
                });
            }
            
            renderChatList();
        }

        window.deleteChat = function(chatId, event) {
            event.stopPropagation();
            if (confirm('Hapus chat ini?')) {
                delete chats[chatId];
                localStorage.setItem('chats', JSON.stringify(chats));
                if (currentChatId === chatId) {
                    createNewChat();
                } else {
                    renderChatList();
                }
            }
        }

        function renderChatList() {
            chatList.innerHTML = '';
            const sortedChats = Object.entries(chats).sort((a, b) => b[1].timestamp - a[1].timestamp);
            
            sortedChats.forEach(([chatId, chat]) => {
                const div = document.createElement('div');
                div.className = `chat-item ${chatId === currentChatId ? 'active' : ''}`;
                div.innerHTML = `
                    <div class="chat-item-title">${chat.title}</div>
                    <button class="delete-chat" onclick="deleteChat('${chatId}', event)">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                `;
                div.onclick = () => {
                    loadChat(chatId);
                    toggleSidebar();
                };
                chatList.appendChild(div);
            });
        }

        window.logout = function() {
            if (confirm('Yakin ingin logout?')) {
                localStorage.removeItem('userSession');
                window.location.href = 'index.html';
            }
        }

        window.copyCode = function(button) {
            const wrapper = button.closest('.code-block-wrapper');
            const codeElement = wrapper.querySelector('code');
            const code = codeElement.textContent;
            
            navigator.clipboard.writeText(code).then(() => {
                const originalHTML = button.innerHTML;
                button.innerHTML = `
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    Tersalin
                `;
                button.classList.add('copied');
                
                setTimeout(() => {
                    button.innerHTML = originalHTML;
                    button.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
                alert('Gagal menyalin kode. Silakan coba lagi.');
            });
        }

        loadCredits();
        updateUserInfo();

        userInput.addEventListener('input', function() {
            if (this.value.trim()) {
                sendBtn.classList.remove('hidden');
                scrollBtn.classList.add('hidden');
            } else {
                sendBtn.classList.add('hidden');
                scrollBtn.classList.remove('hidden');
            }
        });

        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && this.value.trim()) {
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        scrollBtn.addEventListener('click', () => {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            const check = canMakeRequest();
            if (!check.allowed) {
                showError(check.message);
                return;
            }

            if (!currentChatId) {
                createNewChat();
            }

            welcomeScreen.classList.add('hidden');

            addMessage(message, 'user', true);
            userInput.value = '';
            sendBtn.classList.add('hidden');
            scrollBtn.classList.remove('hidden');

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.innerHTML = '<div class="message-content"><div class="loading"><span></span><span></span><span></span></div></div>';
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await sendToDeepSeek(message);
                
                loadingDiv.remove();
                addMessage(response, 'assistant', true);
                
                if (chats[currentChatId].messages.length === 2) {
                    chats[currentChatId].title = message.substring(0, 30) + (message.length > 30 ? '...' : '');
                    localStorage.setItem('chats', JSON.stringify(chats));
                    renderChatList();
                }
                
                await decrementCredits();
            } catch (error) {
                loadingDiv.remove();
                showError(error.message);
            }
        }

        function addMessage(text, sender, save = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            if (text.includes('```')) {
                contentDiv.innerHTML = formatCodeBlocks(text);
            } else {
                contentDiv.textContent = text;
            }
            
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            if (save && currentChatId) {
                chats[currentChatId].messages.push({ text, sender });
                chats[currentChatId].timestamp = Date.now();
                localStorage.setItem('chats', JSON.stringify(chats));
            }
        }

        function formatCodeBlocks(text) {
            return text.replace(/```(\w+)?\n([\s\S]*?)```/g, function(match, lang, code) {
                const language = lang || 'code';
                const cleanCode = code.trim();
                const escapedCode = escapeHtml(cleanCode);
                
                return `
                    <div class="code-block-wrapper">
                        <div class="code-header">
                            <span class="code-language">${language}</span>
                            <button class="copy-btn" onclick="copyCode(this)">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                                Salin
                            </button>
                        </div>
                        <pre><code>${escapedCode}</code></pre>
                    </div>
                `;
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            chatContainer.appendChild(errorDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            setTimeout(() => errorDiv.remove(), 5000);
        }

        // Initialize
        if (Object.keys(chats).length === 0) {
            createNewChat();
        } else {
            const lastChatId = Object.keys(chats).sort((a, b) => chats[b].timestamp - chats[a].timestamp)[0];
            loadChat(lastChatId);
        }
        renderChatList();

        // Close user info when clicking outside
        document.addEventListener('click', function(event) {
            if (!userInfo.contains(event.target) && !event.target.closest('.user-btn')) {
                userInfo.classList.remove('show');
            }
        });
    </script>
</body>
</html>
